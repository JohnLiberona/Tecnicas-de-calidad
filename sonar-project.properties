# sonar-project.properties - adapta las propiedades según el proyecto
# Cambia sonar.projectKey por un identificador único (ej: JohnLiberona_Tecnicas-de-calidad)
sonar.projectKey=JohnLiberona_Tecnicas-de-calidad
# Para SonarCloud, añade la organización:
# sonar.organization=tu_organizacion_en_sonarcloud

# Fuentes y exclusiones
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/.git/**

# Si tienes tests en carpetas separadas:
# sonar.tests=tests

# Si es Java (Maven): especifica binarios
# sonar.java.binaries=target/classes

# Encoding
sonar.sourceEncoding=UTF-8
